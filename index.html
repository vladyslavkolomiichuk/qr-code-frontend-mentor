<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>
    <style>
      @font-face {
        font-family: 'Outfit';
        src: url('https://fonts.google.com/specimen/Outfit') format('woff2');
        font-weight: normal;
        font-style: normal;
      }

      :root {
        /* Colors */
        --white: hsl(0, 0%, 100%);
        --state-900: hsl(218, 44%, 22%);
        --state-500: hsl(216, 15%, 48%);
        --state-300: hsl(212, 45%, 89%);

        /* Spacing */
        --spacing-sm: 16px;
        --spacing-md: 24px;
        --spacing-lg: 40px;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--state-300);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        border-radius: 20px;
        padding: var(--spacing-sm);
        padding-bottom: var(--spacing-lg);
        background-color: var(--white);

        box-shadow: 0px 25px 25px rgba(0, 0, 0, 0.05);

        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--spacing-md);
      }

      .card img {
        width: 288px;
        height: 288px;
        border-radius: 10px;
      }

      .card-info {
        padding: 0 var(--spacing-sm);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--spacing-sm);
      }

      .card-text {
        margin: 0;
        max-width: 256px;
        text-align: center;
      }

      .card-title {
        font-size: 22px;
        font-weight: 700;
        line-height: 120%;
        letter-spacing: 0;
        color: var(--state-900);
      }

      .card-description {
        font-size: 15px;
        line-height: 140%;
        font-weight: 400;
        letter-spacing: 0.2px;
        color: var(--state-500);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./images/image-qr-code.png" alt="qr-code" />
      <div class="card-info">
        <h3 class="card-title card-text">
          Improve your front-end skills by building projects
        </h3>
        <p class="card-description card-text">
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
    </div>
  </body>
</html>
